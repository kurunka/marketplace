name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend — lint & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check app tests

      - name: Pytest
        run: |
          set +e
          pytest -q --tb=long > pytest.log 2>&1
          code=$?
          cat pytest.log
          if [ $code -ne 0 ]; then
            python -c "import pathlib;log=pathlib.Path('pytest.log').read_text(errors='replace')[-2500:];print('::error title=pytest failed::'+log.replace('%','%25').replace(chr(13),'').replace(chr(10),'%0A'))"
          fi
          exit $code

  frontend:
    name: Frontend — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  docker:
    name: Docker — build images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: market-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: market-frontend:ci

  smoke:
    name: Compose — up & healthcheck
    runs-on: ubuntu-latest
    needs: [docker]
    steps:
      - uses: actions/checkout@v4

      - name: Boot the stack
        run: docker compose up -d --build

      - name: Wait for API
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost/api/health; then exit 0; fi
            sleep 2
          done
          echo "API did not come up"
          exit 1

      - name: Catalog responds
        run: curl -fsS "http://localhost/api/products" | head -c 300

      - name: Diagnostics
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=150 > compose.log 2>&1 || true
          python -c "import pathlib;log=pathlib.Path('compose.log').read_text(errors='replace')[-6000:];print('::error title=compose logs::'+log.replace('%','%25').replace(chr(13),'').replace(chr(10),'%0A'))"

      - name: Tear down
        if: always()
        run: docker compose down -v
